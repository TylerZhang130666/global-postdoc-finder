name: Website checks and GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/build_web_catalog.py', 'scripts/sync_jobs.py', 'scripts/notice_index.py', 'scripts/notice_details.py', 'scripts/build_hosts.py', 'scripts/sync_hosts.py', 'references/host-seeds.json', 'references/source-catalog.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**', 'scripts/build_web_catalog.py', 'scripts/sync_jobs.py', 'scripts/notice_index.py', 'scripts/notice_details.py', 'scripts/build_hosts.py', 'scripts/sync_hosts.py', 'references/host-seeds.json', 'references/source-catalog.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh public source directory
        run: python scripts/build_web_catalog.py
      - name: Check website logic
        run: node --test web/tests/*.test.mjs
      - name: Test source parsers
        run: python -m unittest discover -s tests -v
      - name: Sync public job listings
        if: github.event_name != 'pull_request'
        run: python scripts/sync_jobs.py --use-published-cache
      - name: Refresh official host directories
        # Host evidence uses its own seven-day TTL; job refreshes cannot erase it.
        run: python scripts/sync_hosts.py --use-published-cache
        if: github.event_name != 'pull_request'
      - name: Scan public website data
        run: python scripts/privacy_scan.py web
      - name: Prepare static files only
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/data
          cp web/index.html web/style.css web/app.mjs web/core.mjs web/jobs.mjs web/career.mjs web/profile.mjs web/cv-reader.mjs web/favicon.svg _site/
          cp web/data/sources.json web/data/jobs.json web/data/hosts.json _site/data/
          cp -R web/vendor _site/vendor
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
