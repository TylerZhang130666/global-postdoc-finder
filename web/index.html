<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="搜索博后岗位。按方向、地区和机构筛选，查看公告，收藏岗位。">
<meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer">
<title>博后搜索 · Global Postdoc Finder</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=5"><script type="module" src="./app.mjs?v=5"></script>
</head><body>
<a class="skip" href="#main">跳到内容</a>
<div class="page">
<header class="masthead"><a class="wordmark" href="./">博后搜索 <span>Global Postdoc Finder</span></a><nav class="tabs" aria-label="导航"><button id="tab-search" role="tab" aria-controls="search-panel" aria-selected="true" data-tab="search">岗位</button><button id="tab-list" role="tab" aria-controls="list-panel" aria-selected="false" data-tab="list">收藏 <small id="list-count">0</small></button></nav></header>
<main id="main">
<section id="search-panel" role="tabpanel" aria-labelledby="tab-search">
<div class="search-header"><h1>找博后</h1>
<form id="search-form" role="search"><div class="search-input"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="keywords">关键词</label><input id="keywords" type="search" placeholder="方向、学校或岗位名称" maxlength="160" autocomplete="off"></div><label class="sr-only" for="region">地区</label><select id="region"><option value="all">全部地区</option></select><button class="primary" type="submit">搜索</button></form>
<div class="suggestions"><span>试试</span><button type="button" data-keyword="遥感">遥感</button><button type="button" data-keyword="生态">生态</button><button type="button" data-keyword="机器学习">机器学习</button></div></div>
<div class="result-toolbar"><h2 id="results-count" aria-live="polite">加载岗位…</h2><div class="result-filters"><label class="sr-only" for="source-filter">来源</label><select id="source-filter"><option value="all">全部来源</option></select><label class="sr-only" for="job-sort">排序</label><select id="job-sort"><option value="recent">最新发布</option><option value="deadline">即将截止</option></select><label class="checkbox"><input id="hide-expired" type="checkbox" checked>隐藏已到期</label></div></div>
<div class="index-meta"><span id="index-date"></span><button id="refresh-jobs" type="button">刷新</button><details id="coverage"><summary>数据来源</summary><div class="coverage-content"><p id="index-total"></p><div id="coverage-list"></div><p>每小时尝试采集；刷新按钮读取最新岗位库，不会即时采集全网。</p><a href="https://github.com/TylerZhang130666/global-postdoc-finder/actions/workflows/pages.yml" target="_blank" rel="noopener noreferrer">维护者手动采集 ↗</a><br><a href="https://github.com/TylerZhang130666/global-postdoc-finder/blob/main/examples/search-audit-2026-11-18/README.md" target="_blank" rel="noopener noreferrer">收录与漏检核查 ↗</a></div></details><span id="refresh-status" role="status" aria-live="polite"></span></div>
<div class="jobs-layout"><div><div id="job-results"></div><div id="pagination" class="pagination" hidden><button id="prev-page" class="secondary">上一页</button><span id="page-label"></span><button id="next-page" class="secondary">下一页</button></div></div><aside id="job-detail" aria-label="岗位详情"></aside></div>
</section>
<section id="list-panel" role="tabpanel" aria-labelledby="tab-list" hidden>
<div class="section-heading"><h1>收藏</h1><button id="add-record" class="secondary">手动添加</button></div><div id="stats" hidden></div>
<div class="list-toolbar"><label class="sr-only" for="list-query">搜索收藏</label><input id="list-query" type="search" placeholder="搜索收藏"><label class="sr-only" for="list-type">类型</label><select id="list-type"><option value="all">全部类型</option><option value="advertised_job">岗位</option><option value="fellowship">基金</option><option value="potential_host">团队</option></select><label class="sr-only" for="list-progress">进度</label><select id="list-progress"><option value="all">全部进度</option><option value="saved">已收藏</option><option value="checking">核实中</option><option value="preparing">准备材料</option><option value="contacted">已联系</option><option value="applied">已申请</option><option value="archived">已归档</option></select></div>
<p id="list-caption" class="muted"></p><div id="records"></div>
<details class="data-tools"><summary>导入与备份</summary><p>收藏保存在当前浏览器，建议定期导出 JSON 备份。</p><div class="data-buttons"><button id="export-json" class="secondary">导出 JSON</button><button id="export-csv" class="secondary">导出 CSV</button><button id="import-button" class="secondary">导入 JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden></div><p>支持导入博后搜索 Skill 的记录。导入不会更新招聘信息。</p></details>
</section>
<section id="verify-panel" aria-label="编辑收藏" hidden>
<div class="section-heading"><h1>岗位记录</h1><button id="back-list" class="text-button">返回收藏</button></div>
<form id="opportunity-form">
<label for="source-url">原始链接</label><div class="url-row"><input id="source-url" type="url" placeholder="https://…" required maxlength="2048"><button type="button" id="inspect-url" class="secondary">检查网址</button></div><p id="url-feedback" class="muted"></p>
<label>标题<input id="record-title" required maxlength="300"></label><div class="two-fields"><label>机构<input id="institution" maxlength="200"></label><label>国家或地区<input id="country" maxlength="100"></label></div>
<div class="two-fields"><label>进度<select id="progress"><option value="saved">已收藏</option><option value="checking">核实中</option><option value="preparing">准备材料</option><option value="contacted">已联系</option><option value="applied">已申请</option><option value="archived">已归档</option></select></label><label>截止日期<input id="deadline" type="date"></label></div>
<label>下一步<input id="next-action" maxlength="500" placeholder="待办事项"></label><label>备注<textarea id="evidence" rows="4" maxlength="12000"></textarea></label>
<details class="advanced"><summary>申请条件与核验记录</summary><div class="two-fields"><label>类型<select id="record-type"><option value="advertised_job">岗位</option><option value="fellowship">基金</option><option value="potential_host">团队</option></select></label><label>人工核验日期<input id="checked-on" type="date"></label></div><label>申请状态<select id="availability"><option value="unconfirmed">待确认</option><option value="open">公告显示开放</option><option value="scheduled">后续轮次</option><option value="closed">已确认关闭</option><option value="not_applicable">团队线索，无确认岗位</option></select></label><div id="check-fields" class="check-fields"></div></details>
<div class="form-footer"><p id="editing-label" class="muted"></p><div><button type="button" id="reset-form" class="text-button">清空</button><button type="submit" class="primary">保存</button></div></div>
</form></section>
<div id="storage-problem" class="storage-problem" hidden><p id="storage-message"></p><button id="recover-storage" class="secondary">下载原始数据</button></div>
</main><footer><span>收藏仅保存在当前浏览器</span><a href="https://github.com/TylerZhang130666/global-postdoc-finder" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer></div>
<dialog id="job-dialog" aria-label="岗位详情"><button id="close-detail" aria-label="关闭详情">×</button><div id="mobile-detail"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><noscript><p>请启用 JavaScript。</p></noscript>
</body></html>
